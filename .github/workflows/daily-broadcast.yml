name: Daily MeoW Broadcast

on:
  schedule:
    # GitHub Actions cron is UTC; 07:00 Asia/Shanghai is 23:00 UTC.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write   # ✅ 保活提交需要写权限

concurrency:
  group: daily-meow-broadcast-failure-alert
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      UNION_ID: ${{ secrets.UNION_ID }}
      REPORT_MODE: ${{ secrets.REPORT_MODE }}   # ✅ 新增：all / success / fail / none
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}   # ✅ PAT，public/private 都能用

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Broadcast and notify only on failure
        run: python broadcast.py

      # ✅ 保活提交（防止 60 天无 commit 导致定时任务被禁用）
      - name: 保活提交
        if: always()   # ✅ 广播失败也照常保活
        continue-on-error: true   # ✅ 保活失败不让整个 workflow 标红
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .keepalive-meow
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive-meow
          git diff --staged --quiet || git commit -m "chore: meow keepalive $(date -u +%Y-%m-%d)"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
